<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2c3e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="中国地理クイズ">
<link rel="manifest" href="manifest.webmanifest">
<title>中国地理・都市クイズ v6</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --primary:#2c3e50; --accent:#c0392b;
    --text:#2c3e50; --muted:#7f8c8d; --success:#27ae60; --danger:#e74c3c;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
    background:var(--bg); color:var(--text); margin:0; -webkit-tap-highlight-color:transparent;
  }
  header{background:var(--primary); color:#fff; padding:18px; text-align:center;}
  header h1{margin:0; font-size:20px;}
  main{max-width:900px; margin:0 auto; padding:16px;}
  .screen{display:none;}
  .screen.active{display:block;}
  h2{font-size:16px; color:var(--muted); margin:20px 0 10px;}
  .genre-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media(min-width:700px){.genre-grid{grid-template-columns:repeat(3,1fr);}}
  .genre-btn{
    padding:16px 8px; border-radius:12px; border:2px solid transparent;
    background:var(--card); box-shadow:0 2px 6px rgba(0,0,0,0.08);
    cursor:pointer; text-align:center; font-size:13px; user-select:none;
  }
  .genre-btn .icon{font-size:26px; display:block; margin-bottom:6px;}
  .genre-btn.selected{border-color:var(--accent); background:#fdf2f1;}
  .level-row{display:flex; gap:8px;}
  .level-btn{
    flex:1; padding:12px; border-radius:8px; border:2px solid #ddd;
    background:#fff; cursor:pointer; text-align:center; user-select:none;
  }
  .level-btn.selected{border-color:var(--accent); background:#fdf2f1;}
  button.primary{
    background:var(--accent); color:#fff; border:none; padding:14px;
    border-radius:8px; font-size:16px; cursor:pointer; width:100%; margin-top:16px;
  }
  button.primary:active{opacity:0.85;}
  button.secondary{
    background:#ecf0f1; color:var(--text); border:none; padding:12px;
    border-radius:8px; cursor:pointer; width:100%; margin-top:8px; font-size:14px;
  }
  .note{font-size:12px; color:#999; text-align:center; margin-top:18px; line-height:1.6;}
  .question-box{
    background:var(--card); border-radius:12px; padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:14px;
  }
  .progress{color:var(--muted); font-size:13px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  #quiz-question{font-size:17px; font-weight:bold; line-height:1.5;}
  .chinese-info{font-size:13px; color:var(--muted); font-weight:normal; margin-top:8px;}
  .choice-list{display:flex; flex-direction:column; gap:10px;}
  .choice-btn{
    padding:14px; border-radius:8px; border:2px solid #ddd; background:#fff;
    text-align:left; cursor:pointer; font-size:15px; width:100%;
  }
  .choice-btn.correct{border-color:var(--success); background:#eafaf1;}
  .choice-btn.wrong{border-color:var(--danger); background:#fdecea;}
  .dontknow-btn{display:block; width:100%; margin-top:10px; padding:12px; border-radius:8px; border:2px dashed #bbb; background:#fafafa; color:#777; font-size:14px; cursor:pointer;}
  .dontknow-btn.chosen{border-color:#999; background:#eee; color:#555;}
  .dontknow-btn:disabled{cursor:default;}
  .choice-btn:disabled{opacity:0.9;}
  .svg-map{width:100%; max-width:600px; display:block; margin:0 auto; touch-action:manipulation;}
  .province{fill:#bcd3e0; stroke:#fff; stroke-width:0.8; stroke-linejoin:round; cursor:pointer; fill-rule:evenodd; vector-effect:non-scaling-stroke;}
  .province:hover{fill:#9bbccf;}
  .province.correct{fill:var(--success) !important;}
  .province.wrong{fill:var(--danger) !important;}
  .province-bg{fill:#e9eef1; stroke:#fff; stroke-width:0.8; stroke-linejoin:round; fill-rule:evenodd; vector-effect:non-scaling-stroke;}
  .map-other{fill:#d5dde2; stroke:#fff; stroke-width:0.6; fill-rule:evenodd; vector-effect:non-scaling-stroke; pointer-events:none;}
  .inset-frame{fill:#fafcfd; stroke:#9aa7b0; stroke-width:1; vector-effect:non-scaling-stroke; pointer-events:none;}
  .inset-label{font-size:11px; fill:#7f8c8d; pointer-events:none;}
  .map-wrap{position:relative; max-width:600px; margin:0 auto; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); overflow:hidden;}
  .map-wrap .svg-map{cursor:grab;}
  .zoom-ctrl{position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:6px;}
  .zoom-ctrl button{width:34px; height:34px; border-radius:8px; border:1px solid #ccd; background:rgba(255,255,255,0.92); font-size:18px; cursor:pointer; padding:0;}
  .map-status{font-size:11px; color:#999; text-align:center; padding:6px 8px;}
  .city-point{fill:var(--accent); stroke:#fff; stroke-width:2; cursor:pointer; vector-effect:non-scaling-stroke;}
  .city-point.correct{fill:var(--success) !important;}
  .city-point.wrong{fill:var(--danger) !important;}
  .feedback{margin-top:12px; padding:12px; border-radius:8px; min-height:0; font-size:14px;}
  .feedback.correct{background:#eafaf1; color:var(--success);}
  .feedback.wrong{background:#fdecea; color:var(--danger);}
  .feedback .result-line{font-weight:bold;}
  .feedback .explanation{margin-top:8px; font-weight:normal; font-size:13px; color:#555; line-height:1.6;}
  .result-score{font-size:48px; text-align:center; color:var(--accent); font-weight:bold; margin-top:30px;}
  #result-pct{text-align:center; color:var(--muted); margin-top:6px;}
  .filters{display:flex; gap:8px; margin-bottom:12px;}
  select{padding:8px; border-radius:6px; border:1px solid #ddd; flex:1; font-size:13px;}
  table.wrong-table{width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;}
  table.wrong-table th, table.wrong-table td{border-bottom:1px solid #eee; padding:8px 4px; text-align:left;}
  table.wrong-table th{color:var(--muted); font-weight:normal;}
  .link-back{color:var(--muted); font-size:12px; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0;}
</style>
</head>
<body>
<header><h1>🀄 中国地理・都市クイズ</h1></header>
<main>

  <!-- トップ画面 -->
  <section id="screen-top" class="screen active">
    <h2>ジャンルを選択</h2>
    <div class="genre-grid" id="genre-grid"></div>
    <h2>レベルを選択</h2>
    <div class="level-row" id="level-row"></div>
    <button class="primary" id="btn-start">クイズ開始</button>
    <button class="secondary" id="btn-wronglist">誤答リストを見る</button>
    <p class="note">※各ジャンル×難易度30問(計540問)から毎回ランダムに10問出題します。<br>地図データ：DataV.GeoAtlas（省界）を埋め込み済み。オフラインで動作します。</p>
  </section>

  <!-- クイズ画面 -->
  <section id="screen-quiz" class="screen">
    <div class="progress">
      <span id="quiz-progress"></span>
      <button class="link-back" id="btn-quiz-back">✕ 中断してトップへ</button>
    </div>
    <div class="question-box">
      <div id="quiz-question"></div>
    </div>
    <div id="answer-area"></div>
    <div id="quiz-feedback" class="feedback"></div>
    <button class="primary" id="btn-next" style="display:none;">次の問題へ</button>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen">
    <h2 style="text-align:center;">結果</h2>
    <div class="result-score" id="result-score"></div>
    <div id="result-pct"></div>
    <button class="primary" id="btn-retry">同じ条件でもう一度</button>
    <button class="secondary" id="btn-result-back">トップに戻る</button>
  </section>

  <!-- 誤答リスト画面 -->
  <section id="screen-wronglist" class="screen">
    <h2>誤答リスト</h2>
    <div class="filters">
      <select id="wrong-genre-filter"><option value="all">全ジャンル</option></select>
      <select id="wrong-level-filter"><option value="all">全レベル</option></select>
    </div>
    <table class="wrong-table">
      <thead><tr><th>問題</th><th>ジャンル</th><th>レベル</th><th>回数</th><th>最終誤答日時</th></tr></thead>
      <tbody id="wrong-list-body"></tbody>
    </table>
    <button class="primary" id="btn-review-start">この条件で再出題</button>
    <button class="secondary" id="btn-clear-wrong">誤答データを全消去</button>
    <button class="secondary" id="btn-wronglist-back">トップに戻る</button>
  </section>

</main>

// アルベルス正積円錐図法(中国全図で一般的:標準緯線25°/47°、中央経線105°E)
function albers(lon, lat){
  const r = Math.PI/180, p1 = 25*r, p2 = 47*r, l0 = 105*r;
  const n = (Math.sin(p1)+Math.sin(p2))/2;
  const C = Math.cos(p1)**2 + 2*n*Math.sin(p1);
  const rho0 = Math.sqrt(C)/n;
  const rho = Math.sqrt(C - 2*n*Math.sin(lat*r))/n;
  const th = n*(lon*r - l0);
  return [rho*Math.sin(th), -(rho0 - rho*Math.cos(th))];
}

// ECharts 4 形式(UTF8Encoding)の座標デコード
function decodeEchartsGeo(json){
  if(!json.UTF8Encoding) return json;
  const scale = json.UTF8Scale || 1024;
  const decRing = (str, off)=>{
    const out = []; let px = off[0], py = off[1];
    for(let i=0;i<str.length;i+=2){
      let x = str.charCodeAt(i)-64, y = str.charCodeAt(i+1)-64;
      x = (x>>1)^(-(x&1)); y = (y>>1)^(-(y&1));
      x += px; y += py; px = x; py = y;
      out.push([x/scale, y/scale]);
    }
    return out;
  };
  json.features.forEach(f=>{
    const g = f.geometry; if(!g) return;
    if(g.type==='Polygon') g.coordinates = g.coordinates.map((r,i)=>decRing(r, g.encodeOffsets[i]));
    else if(g.type==='MultiPolygon') g.coordinates = g.coordinates.map((poly,j)=>poly.map((r,i)=>decRing(r, g.encodeOffsets[j][i])));
  });
  json.UTF8Encoding = false;
  return json;
}

function featureId(f){
  const p = f.properties || {};
  if(p.adcode && ADCODE_TO_ID[p.adcode]) return ADCODE_TO_ID[p.adcode];
  const name = p.name || '';
  for(const [short,id] of Object.entries(SHORTNAME_TO_ID)) if(name.startsWith(short)) return id;
  return null;
}

// GeoJSON → SVGパス(投影・画面フィット・南シナ海島嶼の挿入図化・点の間引き)
function buildMapFromGeoJSON(json, sourceLabel){
  json = decodeEchartsGeo(json);
  const SOUTH_LAT = 17; // これより南の島嶼(南海諸島)は右下の挿入図に表示
  const polysOf = g => !g ? [] : g.type==='Polygon' ? [g.coordinates] : g.type==='MultiPolygon' ? g.coordinates
                   : g.type==='LineString' ? [[g.coordinates]] : g.type==='MultiLineString' ? [g.coordinates] : [];
  const isSouth = poly => poly[0].every(pt=>pt[1] < SOUTH_LAT);

  // 本図の範囲
  let mn=[Infinity,Infinity], mx=[-Infinity,-Infinity];
  const ext = (b, lon, lat)=>{ const [x,y]=albers(lon,lat);
    b.mn[0]=Math.min(b.mn[0],x); b.mn[1]=Math.min(b.mn[1],y); b.mx[0]=Math.max(b.mx[0],x); b.mx[1]=Math.max(b.mx[1],y); };
  const mainB = {mn:[Infinity,Infinity], mx:[-Infinity,-Infinity]};
  const insB  = {mn:[Infinity,Infinity], mx:[-Infinity,-Infinity]};
  json.features.forEach(f=>polysOf(f.geometry).forEach(poly=>{
    const b = isSouth(poly) ? insB : mainB;
    poly[0].forEach(pt=>ext(b, pt[0], pt[1]));
  }));
  const pad = 12;
  const k = Math.min((MAP_W-2*pad)/(mainB.mx[0]-mainB.mn[0]), (MAP_H-2*pad)/(mainB.mx[1]-mainB.mn[1]));
  const tx = (MAP_W - k*(mainB.mx[0]-mainB.mn[0]))/2 - k*mainB.mn[0];
  const ty = (MAP_H - k*(mainB.mx[1]-mainB.mn[1]))/2 - k*mainB.mn[1];
  const fit = {k, tx, ty};

  // 挿入図(南海諸島):右下に配置
  let inset = null;
  if(isFinite(insB.mn[0])){
    // 挿入図の範囲:南の島嶼+海南島・広東沿岸を少し含める
    ext(insB, 108.5, 23.5); ext(insB, 121.5, 23.5);
    const fw = 118, fh = 160, fx = MAP_W - fw - 6, fy = MAP_H - fh - 6, ip = 6;
    const ik = Math.min((fw-2*ip)/(insB.mx[0]-insB.mn[0]), (fh-2*ip-12)/(insB.mx[1]-insB.mn[1]));
    inset = {fx,fy,fw,fh, k:ik,
      tx: fx + (fw - ik*(insB.mx[0]-insB.mn[0]))/2 - ik*insB.mn[0],
      ty: fy + 4 + (fh - 12 - ik*(insB.mx[1]-insB.mn[1]))/2 - ik*insB.mn[1]};
  }

  const ringPath = (ring, t, minDist)=>{
    const pts = [];
    let last = null;
    ring.forEach((pt,i)=>{
      const [x,y] = albers(pt[0], pt[1]);
      const sx = x*t.k + t.tx, sy = y*t.k + t.ty;
      if(!last || i===ring.length-1 || Math.hypot(sx-last[0], sy-last[1]) >= minDist){
        pts.push([sx,sy]); last=[sx,sy];
      }
    });
    if(pts.length < 3) return '';
    return 'M' + pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L') + 'Z';
  };
  const featPath = (f, forceInset)=>{
    let d='';
    polysOf(f.geometry).forEach(poly=>{
      const south = forceInset || isSouth(poly);
      if(south && !inset) return;
      const t = south ? inset : fit;
      poly.forEach(r=>{ d += ringPath(r, t, south ? 0.25 : 0.35); });
    });
    return d;
  };

  const provinces = [], others = [];
  json.features.forEach(f=>{
    const id = featureId(f);
    if(id) provinces.push({id, name:(f.properties||{}).name||'', d:featPath(f)});
    else { const d = featPath(f); if(d) others.push(d); }   // 南海の境界線・その他
  });
  // 挿入図には海南・広東・広西・台湾の南部輪郭も薄く描く
  let insetBg = '';
  if(inset){
    json.features.forEach(f=>{
      const id = featureId(f);
      if(['hainan','guangdong','guangxi','taiwan','fujian','hongkong','macau'].includes(id)){
        polysOf(f.geometry).forEach(poly=>{ if(!isSouth(poly)) poly.forEach(r=>{ insetBg += ringPath(r, inset, 0.3); }); });
      }
    });
  }
  return {source:sourceLabel, fit, inset, provinces, others, insetBg};
}

function projectLonLat(map, lon, lat){
  const [x,y] = albers(lon, lat);
  return [x*map.fit.k + map.fit.tx, y*map.fit.k + map.fit.ty];

  const apply = ()=>{
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    // 拡大中はドラッグでパン、全体表示中はページスクロールを優先
    svg.style.touchAction = vb.w < MAP_W ? 'none' : 'manipulation';
  };
  const clamp = ()=>{
    vb.w = Math.min(MAP_W, Math.max(MAP_W/8, vb.w)); vb.h = vb.w*MAP_H/MAP_W;
    vb.x = Math.min(MAP_W-vb.w, Math.max(0, vb.x)); vb.y = Math.min(MAP_H-vb.h, Math.max(0, vb.y));
  };
  const zoomAt = (f, cx, cy)=>{
    const nw = vb.w/f;
    vb.x = cx - (cx-vb.x)*(nw/vb.w); vb.y = cy - (cy-vb.y)*(nw/vb.w);
    vb.w = nw; clamp(); apply();
  };
  const toSvg = (clientX, clientY)=>{
    const r = svg.getBoundingClientRect();
    return [vb.x + (clientX-r.left)/r.width*vb.w, vb.y + (clientY-r.top)/r.height*vb.h];
  };
  const ctrl = document.createElement('div'); ctrl.className='zoom-ctrl';
  ctrl.innerHTML = '<button type="button" data-z="in">＋</button><button type="button" data-z="out">－</button><button type="button" data-z="reset">⟲</button>';
  ctrl.addEventListener('click', e=>{
    const z = e.target.dataset.z; if(!z) return;
    if(z==='reset'){ vb.x=0; vb.y=0; vb.w=MAP_W; clamp(); apply(); return; }
    zoomAt(z==='in'?1.6:1/1.6, vb.x+vb.w/2, vb.y+vb.h/2);
  });
  wrap.appendChild(ctrl);
  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    const [cx,cy] = toSvg(e.clientX, e.clientY);
    zoomAt(e.deltaY<0 ? 1.25 : 1/1.25, cx, cy);
  }, {passive:false});
  // ドラッグでパン(一定距離以上動いた場合はクリック扱いにしない)
  let drag = null;
  svg.addEventListener('pointerdown', e=>{ drag = {x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y, moved:false}; });
  svg.addEventListener('pointermove', e=>{
    if(!drag || vb.w>=MAP_W) return;
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if(!drag.moved && Math.hypot(dx,dy) < 6) return;
    drag.moved = true;
    const r = svg.getBoundingClientRect();
    vb.x = drag.vx - dx/r.width*vb.w; vb.y = drag.vy - dy/r.height*vb.h; clamp(); apply();
  });
  const end = ()=>{ if(drag && drag.moved){ svg.dataset.dragged='1'; setTimeout(()=>{ delete svg.dataset.dragged; }, 50); } drag=null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointerleave', end);
}

/* ===================== 状態管理 ===================== */
let state = { selectedGenre:null, selectedLevel:null, questions:[], currentIndex:0, score:0, answered:false, mode:'normal' };

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='wronglist') renderWrongList();
}

/* ===================== 音声 ===================== */
let audioCtx;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, delay=0){
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = freq;
  osc.type = 'sine';
  osc.connect(gain);
  gain.connect(ctx.destination);
  const start = ctx.currentTime + delay;
  gain.gain.setValueAtTime(0.2, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start+duration);
  osc.start(start);
  osc.stop(start+duration);
}
function playCorrectSound(){ playTone(880,0.15,0); playTone(1320,0.2,0.12); }
function playWrongSound(){ playTone(220,0.3,0); }

/* ===================== 誤答管理 ===================== */
const WRONG_KEY = 'cnquiz_wrong_answers';
function loadWrongAnswers(){
  try{ return JSON.parse(localStorage.getItem(WRONG_KEY))||[]; }catch(e){ return []; }
}
function saveWrongAnswers(list){ localStorage.setItem(WRONG_KEY, JSON.stringify(list)); }
function recordWrong(q){
  const list = loadWrongAnswers();
  const now = new Date().toISOString();
  const existing = list.find(w=>w.id===q.id);
  if(existing){ existing.count++; existing.lastDate = now; }
  else{ list.push({id:q.id, genre:q.genre, level:q.level, questionText:q.question, count:1, lastDate:now}); }
  saveWrongAnswers(list);
}
function clearWrongAnswers(){ localStorage.removeItem(WRONG_KEY); }

function renderWrongList(){
  const gf = document.getElementById('wrong-genre-filter').value;
  const lf = document.getElementById('wrong-level-filter').value;
  let list = loadWrongAnswers();
  if(gf!=='all') list = list.filter(w=>w.genre===gf);
  if(lf!=='all') list = list.filter(w=>w.level===lf);
  list.sort((a,b)=> b.count - a.count);
  const tbody = document.getElementById('wrong-list-body');
  if(list.length===0){
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">誤答データがありません</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(w=>`
    <tr>
      <td>${w.questionText}</td>
      <td>${GENRES[w.genre]?.label||w.genre}</td>
      <td>${LEVELS[w.level]||w.level}</td>
      <td>${w.count}</td>
      <td>${new Date(w.lastDate).toLocaleString('ja-JP')}</td>
    </tr>`).join('');
}

/* ===================== 画面初期化 ===================== */
const genreGrid = document.getElementById('genre-grid');
Object.entries(GENRES).forEach(([id,g])=>{
  const btn = document.createElement('div');
  btn.className='genre-btn';
  btn.dataset.id=id;
  btn.innerHTML = `<span class="icon">${g.icon}</span>${g.label}`;
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.genre-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    state.selectedGenre = id;
  });
  genreGrid.appendChild(btn);
});

const levelRow = document.getElementById('level-row');
Object.entries(LEVELS).forEach(([id,label])=>{
  const btn = document.createElement('div');
  btn.className='level-btn';
  btn.dataset.id=id;
  btn.textContent = label;
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    state.selectedLevel = id;
  });
  levelRow.appendChild(btn);
});

Object.entries(GENRES).forEach(([id,g])=>{
  const opt = document.createElement('option');
  opt.value=id; opt.textContent=g.label;
  document.getElementById('wrong-genre-filter').appendChild(opt);
});
Object.entries(LEVELS).forEach(([id,label])=>{
  const opt = document.createElement('option');
  opt.value=id; opt.textContent=label;
  document.getElementById('wrong-level-filter').appendChild(opt);
});
document.getElementById('wrong-genre-filter').addEventListener('change', renderWrongList);
document.getElementById('wrong-level-filter').addEventListener('change', renderWrongList);

/* ===================== クイズ進行 ===================== */
document.getElementById('btn-start').addEventListener('click', ()=>{
  if(!state.selectedGenre || !state.selectedLevel){ alert('ジャンルとレベルを選択してください。'); return; }
  getAudioCtx();
  startQuiz();
});
document.getElementById('btn-wronglist').addEventListener('click', ()=> showScreen('wronglist'));
document.getElementById('btn-wronglist-back').addEventListener('click', ()=> showScreen('top'));
document.getElementById('btn-result-back').addEventListener('click', ()=> showScreen('top'));
document.getElementById('btn-clear-wrong').addEventListener('click', ()=>{
  if(confirm('誤答データを全て消去します。よろしいですか?')){
    clearWrongAnswers();
    renderWrongList();
  }
});
document.getElementById('btn-review-start').addEventListener('click', startReviewQuiz);
document.getElementById('btn-retry').addEventListener('click', ()=>{
  if(state.mode==='review') startReviewQuiz();
  else startQuiz();
});
document.getElementById('btn-next').addEventListener('click', ()=>{
  state.currentIndex++;
  if(state.currentIndex >= state.questions.length) showResult();
  else showQuestion();
});
document.getElementById('btn-quiz-back').addEventListener('click', ()=>{
  if(confirm('クイズを中断してトップに戻りますか?(現在の進行状況は失われます)')){
    showScreen('top');
  }
});

function startQuiz(){
  const qs = ALL_QUESTIONS.filter(q=>q.genre===state.selectedGenre && q.level===state.selectedLevel);
  if(qs.length===0){ alert('この条件の問題がまだありません。'); return; }
  state.questions = shuffle(qs).slice(0,10);
  state.currentIndex=0; state.score=0; state.mode='normal';
  showScreen('quiz'); showQuestion();
}

function startReviewQuiz(){
  getAudioCtx();
  const gf = document.getElementById('wrong-genre-filter').value;
  const lf = document.getElementById('wrong-level-filter').value;
  let wrongList = loadWrongAnswers();
  if(gf!=='all') wrongList = wrongList.filter(w=>w.genre===gf);
  if(lf!=='all') wrongList = wrongList.filter(w=>w.level===lf);
  const ids = wrongList.map(w=>w.id);
  let qs = ALL_QUESTIONS.filter(q=>ids.includes(q.id));
  if(qs.length===0){ alert('対象の誤答データがありません。'); return; }
  state.questions = shuffle(qs).slice(0,10);
  state.currentIndex=0; state.score=0; state.mode='review';
  showScreen('quiz'); showQuestion();
}

function showQuestion(){
  state.answered=false;
  const q = state.questions[state.currentIndex];
  document.getElementById('quiz-progress').textContent =
    `問題 ${state.currentIndex+1} / ${state.questions.length}　|　${GENRES[q.genre].label}・${LEVELS[q.level]}`;
  // 選択式は答える前に中国語表記を出さない(答えが見えてしまうため)
  const hint = q.type==='choice' ? '' : `<div class="chinese-info">${q.chinese} / ${q.pinyin}</div>`;
  document.getElementById('quiz-question').innerHTML = q.question + hint;
  const fb = document.getElementById('quiz-feedback');
  fb.innerHTML=''; fb.className='feedback';
  document.getElementById('btn-next').style.display='none';

  const area = document.getElementById('answer-area');
  area.innerHTML='';

  if(q.type==='choice'){
    const list = document.createElement('div');
    list.className='choice-list';
    // 選択肢の並びを毎回シャッフル(正解位置が固定にならないように)
    const order = shuffle(q.choices.map((_,i)=>i));
    state.choiceOrder = order;
    order.forEach((orig,i)=>{
      const c = q.choices[orig];
      const btn = document.createElement('button');
      btn.className='choice-btn';
      btn.textContent=c;
      btn.addEventListener('click', ()=> handleChoiceAnswer(i,q));
      list.appendChild(btn);
    });
    area.appendChild(list);
  } else if(q.type==='map-province'){
    const div = document.createElement('div'); div.id='map-container';
    area.appendChild(div);
    renderProvinceMap(q).catch(showMapError);
  } else if(q.type==='map-city'){
    const div = document.createElement('div'); div.id='map-container';
    area.appendChild(div);
    renderCityMap(q).catch(showMapError);
  }
  // 「わからない」ボタン(全問題共通)
  const dk = document.createElement('button');
  dk.className='dontknow-btn'; dk.id='btn-dontknow'; dk.type='button';
  dk.textContent='わからない';
  dk.addEventListener('click', ()=> handleDontKnow(q));
  area.appendChild(dk);
}

function handleDontKnow(q){
  if(state.answered) return;
  state.answered=true;
  if(q.type==='choice'){
    const order = state.choiceOrder || q.choices.map((_,i)=>i);
    const btns = document.querySelectorAll('.choice-btn');
    btns[order.indexOf(q.answerIndex)].classList.add('correct');
    btns.forEach(b=>b.disabled=true);
    document.getElementById('quiz-question').innerHTML +=
      `<div class="chinese-info">${q.chinese} / ${q.pinyin}</div>`;
  } else {
    const sel = q.type==='map-province' ? '.province' : '.city-point';
    document.querySelectorAll(sel).forEach(el=>{ if(el.dataset.id===q.answer) el.classList.add('correct'); });
  }
  finishAnswer(false, q, true);
}

// 地図の土台(高精度データ or フォールバック)を描画して返す
async function buildBaseMap(q, interactive){
  const container = document.getElementById('map-container');
  container.innerHTML = '<div class="map-status">地図を読み込み中…</div>';
  const map = await mapReady;
  if(state.questions[state.currentIndex] !== q || !document.getElementById('map-container')) return null;
  let svg = `<svg class="svg-map" viewBox="0 0 ${MAP_W} ${MAP_H}" xmlns="http://www.w3.org/2000/svg">`;
  if(map){
    const cls = interactive ? 'province' : 'province-bg';
    map.provinces.forEach(p=>{ svg += `<path class="${cls}" data-id="${p.id}" d="${p.d}"></path>`; });
    map.others.forEach(d=>{ svg += `<path class="map-other" d="${d}"></path>`; });
    if(map.inset){
      const i = map.inset;
      svg += `<rect class="inset-frame" x="${i.fx}" y="${i.fy}" width="${i.fw}" height="${i.fh}"></rect>`;
      if(map.insetBg) svg += `<path class="map-other" d="${map.insetBg}"></path>`;
      svg += `<text class="inset-label" x="${i.fx+i.fw-6}" y="${i.fy+i.fh-6}" text-anchor="end">南海诸岛</text>`;
    }
  } else {
    const cls = interactive ? 'province' : 'province-bg';
    for(const [id,points] of Object.entries(PROVINCE_PATHS)){
      svg += `<polygon class="${cls}" data-id="${id}" points="${points}"></polygon>`;
    }
  }
  return {map, svg};
}
function mountMap(svgStr, map){
  const container = document.getElementById('map-container');
  const status = map ? `地図データ: ${map.source}` : '';
  container.innerHTML = `<div class="map-wrap">${svgStr}</div><div class="map-status">${status}</div>`;
  const wrap = container.querySelector('.map-wrap');
  const svg = wrap.querySelector('svg');
  attachZoom(svg, wrap);
  return svg;
}
function showMapError(e){
  const c = document.getElementById('map-container');
  if(c) c.innerHTML = '<div class="map-status" style="color:#c0392b;">地図の表示でエラーが発生しました：' + (e && e.message ? e.message : e) + '</div>';
}
async function renderProvinceMap(q){
  const base = await buildBaseMap(q, true);
  if(!base) return;
  const svg = mountMap(base.svg + '</svg>', base.map);
  svg.querySelectorAll('.province').forEach(el=>{
    el.addEventListener('click', ()=>{ if(svg.dataset.dragged) return; handleMapProvinceClick(el.dataset.id, q); });
  });
}
async function renderCityMap(q){
  const base = await buildBaseMap(q, false);
  if(!base) return;
  let svg = base.svg;
  shuffle(q.cityChoices).forEach(cityId=>{
    let c;
    if(base.map && CITY_LONLAT[cityId]) c = projectLonLat(base.map, ...CITY_LONLAT[cityId]);
    else c = CITY_COORDS[cityId];
    if(!c) return;
    svg += `<circle class="city-point" data-id="${cityId}" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${base.map?8:11}"></circle>`;
  });
  const el = mountMap(svg + '</svg>', base.map);
  el.querySelectorAll('.city-point').forEach(pt=>{
    pt.addEventListener('click', ()=>{ if(el.dataset.dragged) return; handleMapCityClick(pt.dataset.id, q); });
  });
}

function handleChoiceAnswer(index, q){
  if(state.answered) return;
  state.answered=true;
  const order = state.choiceOrder || q.choices.map((_,i)=>i);
  const correctPos = order.indexOf(q.answerIndex);
  const correct = index===correctPos;
  const btns = document.querySelectorAll('.choice-btn');
  btns[index].classList.add(correct?'correct':'wrong');
  if(!correct) btns[correctPos].classList.add('correct');
  btns.forEach(b=>b.disabled=true);
  // 回答後に中国語表記・ピンインを表示(学習用)
  document.getElementById('quiz-question').innerHTML +=
    `<div class="chinese-info">${q.chinese} / ${q.pinyin}</div>`;
  finishAnswer(correct, q);
}

function handleMapProvinceClick(id, q){
  if(state.answered) return;
  state.answered=true;
  const correct = id===q.answer;
  document.querySelectorAll('.province').forEach(el=>{
    if(el.dataset.id===id) el.classList.add(correct?'correct':'wrong');
    if(!correct && el.dataset.id===q.answer) el.classList.add('correct');
  });
  finishAnswer(correct, q);
}

function handleMapCityClick(id, q){
  if(state.answered) return;
  state.answered=true;
  const correct = id===q.answer;
  document.querySelectorAll('.city-point').forEach(el=>{
    if(el.dataset.id===id) el.classList.add(correct?'correct':'wrong');
    if(!correct && el.dataset.id===q.answer) el.classList.add('correct');
  });
  finishAnswer(correct, q);
}

function finishAnswer(correct, q, dontKnow){
  if(correct){ playCorrectSound(); state.score++; }
  else{ if(!dontKnow) playWrongSound(); recordWrong(q); }
  const fb = document.getElementById('quiz-feedback');
  const resultLine = correct ? '✅ 正解!' : (dontKnow ? '🤔 わからない → 正解はこちら' : `❌ 不正解`);
  const dkb = document.getElementById('btn-dontknow');
  if(dkb){ dkb.disabled=true; if(dontKnow) dkb.classList.add('chosen'); }
  fb.innerHTML = `<div class="result-line">${resultLine}</div><div class="explanation">${q.explanation||''}</div>`;
  fb.className = 'feedback ' + (correct?'correct':'wrong');
  document.getElementById('btn-next').style.display='block';
}

function showResult(){
  showScreen('result');
  const total = state.questions.length;
  const score = state.score;
  const pct = total>0 ? Math.round(score/total*100) : 0;
  document.getElementById('result-score').textContent = `${score} / ${total}`;
  document.getElementById('result-pct').textContent = `正答率 ${pct}%`;
}
</script>
